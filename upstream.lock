# Pinned upstream Omarchy checkout used by build/fetch-upstream.sh.
# Bump deliberately: Quattro is alpha and moves fast.
# 4d017913 is quattro tip (2026-09-01). The tree's version file is still
# 4.0.0.alpha. omarchy-pkgs 4.0.1 / 4.0.2 and tags v4.0.1 / v4.0.2 diverged
# from this branch, so OMARCHY_VERSION stays 4.0.0rc3 until quattro itself
# cuts a newer release. The omarchy and omarchy-settings packages the image
# builder builds MUST match this ref.
OMARCHY_REPO=https://github.com/basecamp/omarchy
OMARCHY_BRANCH=quattro
OMARCHY_REF=4d017913d06f715da9d960021861cf535e4f15aa
OMARCHY_VERSION=4.0.0rc3

# Pinned upstream Omarchy checkout used by build/fetch-upstream.sh.
# Bump deliberately: Quattro is alpha and moves fast.
# 06e32d24 is quattro tip (2026-08-28). The tree's version file is still
# 4.0.0.alpha. omarchy-pkgs 4.0.1 / tag v4.0.1 is a diverged release-cut
# (35 behind / 110 ahead of this tip), so OMARCHY_VERSION stays 4.0.0rc3
# until quattro itself cuts a newer release. The omarchy and
# omarchy-settings packages the image builder builds MUST match this ref.
OMARCHY_REPO=https://github.com/basecamp/omarchy
OMARCHY_BRANCH=quattro
OMARCHY_REF=06e32d243d5c410e2421b9f3db5be3c3ae33d3e2
OMARCHY_VERSION=4.0.0rc3

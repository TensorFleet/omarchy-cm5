# Pinned upstream Omarchy checkout used by build/fetch-upstream.sh.
# Bump deliberately: Quattro is alpha and moves fast.
# 0b3f1b7e is quattro tip (2026-08-29). The tree's version file is still
# 4.0.0.alpha. omarchy-pkgs 4.0.1 / tag v4.0.1 is a diverged release-cut
# and is not this pin, so OMARCHY_VERSION stays 4.0.0rc3 until quattro
# itself cuts a newer release. The omarchy and omarchy-settings packages
# the image builder builds MUST match this ref.
OMARCHY_REPO=https://github.com/basecamp/omarchy
OMARCHY_BRANCH=quattro
OMARCHY_REF=0b3f1b7ead00ac4bcbaae8bac16bab3f7efbe516
OMARCHY_VERSION=4.0.0rc3

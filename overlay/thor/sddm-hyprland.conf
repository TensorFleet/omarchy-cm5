# SDDM greeter compositor. Omarchy starts
#   start-hyprland -- --config /usr/share/sddm/hyprland.conf
# so this file is what the login screen uses — not monitors.lua.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

# Native mode is 1080x1920 portrait. Clamshell is landscape.
# DTS rotation = 90; Hyprland transform 1 = 90° clockwise.
monitor = DSI-2, 1080x1920, 0x0, 1, transform, 1
monitor = DSI-1, 1080x1920, auto-down, 1, transform, 1

render {
    explicit_sync = 0
}

cursor {
    no_hardware_cursors = true
}

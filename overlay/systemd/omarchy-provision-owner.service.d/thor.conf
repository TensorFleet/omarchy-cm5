[Unit]
After=omarchy-thor-kb.service
Wants=omarchy-thor-kb.service

[Service]
Environment=PATH=/usr/local/lib/omarchy-thor:/usr/local/bin:/usr/sbin:/usr/bin
# Let getty@tty1 come back if SDDM fails. RemainAfterExit on the stock
# unit keeps Conflicts=getty@tty1 and leaves the purple setup console.
RemainAfterExit=no

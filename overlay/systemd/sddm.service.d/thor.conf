# Do not Wants=dev-dri-card0.device. That unit often never appears on this
# udev (even when /dev/dri/card0 exists) and systemd sits on
# "A start job is running for /dev/dri/card0" for DeviceTimeoutSec (90s).
[Unit]
After=systemd-udev-trigger.service

[Service]
ExecStartPre=/usr/local/bin/omarchy-thor-wait-dri
TimeoutStartSec=120

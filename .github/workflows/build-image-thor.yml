name: build-image-thor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build/**
      - overlay/install/hardware/ayn-thor.sh
      - overlay/install/omarchy-thor-*.sh
      - overlay/install/packages.thor.add
      - overlay/systemd/**
      - overlay/thor/**
      - pkgs/aarch64-extra/linux-rocknix-sm8550/**
      - pkgs/aarch64-extra/linux-firmware-thor/**
      - pkgs/aarch64-extra/wvkbd/**
      - pkgs/build-in-chroot.sh
      - upstream.lock
      - .github/workflows/build-image-thor.yml
      - tests/thor-source.test.sh

concurrency:
  group: build-image-thor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Verify Thor source payload
        run: bash tests/thor-source.test.sh

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static arch-install-scripts libarchive-tools \
            dosfstools parted file squashfs-tools mtools zstd python3
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q flags:.*F /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Cache ROCKNIX vendor extract
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            pkgs/aarch64-extra/linux-rocknix-sm8550/vendor
            pkgs/aarch64-extra/linux-rocknix-sm8550/vendor.tar.zst
            pkgs/aarch64-extra/linux-firmware-thor/vendor
            pkgs/aarch64-extra/linux-firmware-thor/vendor.tar.zst
          key: thor-vendor-${{ hashFiles('build/thor-vendor.lock', 'pkgs/aarch64-extra/linux-rocknix-sm8550/extract.sh') }}

      - name: Extract ROCKNIX KERNEL / modules / firmware
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash build/fetch-thor-vendor.sh

      - name: Fetch pinned upstream omarchy
        run: bash build/fetch-upstream.sh

      - name: Resolve aarch64 package availability
        run: bash build/resolve-packages.sh

      - name: Fetch prebuilt aarch64 packages (rolling pool, if published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/pkgs-out
          gh release download aarch64-pkgs -p '*.pkg.tar.*' -D build/pkgs-out \
            -R "$GITHUB_REPOSITORY" 2>/dev/null && ls -la build/pkgs-out ||
            echo "no aarch64-pkgs release yet — image gets the 'any' packages only"

      - name: Build required Thor aarch64 desktop packages
        run: |
          sudo CHROOT=/mnt/omarchy-wvkbd OUT="$PWD/build/pkgs-out" \
            bash pkgs/build-in-chroot.sh wvkbd quickshell-git
          sudo chown -R "$(id -u):$(id -g)" build/pkgs-out
          test -n "$(find build/pkgs-out -maxdepth 1 -name 'wvkbd-*.pkg.tar.*' -print -quit)"
          test -n "$(find build/pkgs-out -maxdepth 1 -name 'quickshell-git-*.pkg.tar.*' -print -quit)"

      - name: Build omarchy 'any' packages (Arch container)
        run: |
          docker run --rm -v "$PWD:/work" archlinux/archlinux:latest \
            bash /work/build/build-any-packages.sh
          sudo chown -R "$(id -u):$(id -g)" build/pkgs-out
          ls -la build/pkgs-out

      - name: Download Node.js arm64 tarball (offline first-boot setup)
        run: |
          mkdir -p build/node
          file=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/ |
            grep -o 'node-v[0-9.]*-linux-arm64\.tar\.gz' | head -1)
          curl -fL --retry 3 -o "build/node/$file" "https://nodejs.org/dist/latest-v22.x/$file"

      - name: Build Thor image
        run: |
          sudo mkdir -p /mnt/omarchy-build/cache
          OMARCHY_REPO_URL=$(cat build/resolved/omarchy-repo.txt || true)
          sudo env \
            BOARD=ayn-thor \
            IMG=/mnt/omarchy-build/omarchy-thor.img \
            IMG_SIZE=12G \
            CACHE_DIR=/mnt/omarchy-build/cache \
            LOCAL_PKG_DIR="$PWD/build/pkgs-out" \
            OMARCHY_REPO_URL="$OMARCHY_REPO_URL" \
            NODE_TARBALL_PATH="$(ls "$PWD"/build/node/node-v*-linux-arm64.tar.gz | head -1)" \
            bash build/mkimage.sh

      - name: Verify image
        run: sudo env BOARD=ayn-thor bash build/verify-image.sh /mnt/omarchy-build/omarchy-thor.img

      - name: Compress and checksum
        run: |
          cd /mnt/omarchy-build
          sudo rm -rf cache
          sudo xz -T0 -6 -v omarchy-thor.img
          sudo split -b 1900M -d omarchy-thor.img.xz omarchy-thor.img.xz.part
          if [ "$(ls omarchy-thor.img.xz.part* | wc -l)" -eq 1 ]; then
            sudo mv omarchy-thor.img.xz.part00 omarchy-thor.img.xz
          else
            sudo rm omarchy-thor.img.xz
          fi
          sudo sh -c 'sha256sum omarchy-thor.img.xz* omarchy-thor.img.report.txt omarchy-thor.VERIFICATION.txt > SHA256SUMS'
          sudo chown -R "$(id -u):$(id -g)" /mnt/omarchy-build

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="thor-build-${{ github.run_number }}"
          {
            echo "Omarchy Quattro for AYN Thor (SM8550) — flashable microSD image."
            echo
            echo 'ABL is already on the device. Flash this to a **spare** card'
            echo '(do not overwrite the ROCKNIX ROM card). Vol− at power-on,'
            echo 'device Thor, boot Linux. Vol+ still forces Android.'
            echo
            echo '```'
            echo 'xz -dc omarchy-thor.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync'
            echo '```'
            echo 'If the image is split into `*.partNN`, reassemble it first:'
            echo '```'
            echo 'cat omarchy-thor.img.xz.part* > omarchy-thor.img.xz'
            echo '```'
            echo 'Verify the download with `sha256sum -c SHA256SUMS`, then flash.'
            echo
            echo 'First boot uses the Thor gamepad and bottom-screen keyboard for owner'
            echo 'provisioning, then automatically starts the complete Omarchy desktop.'
            echo 'See `docs/thor.md` in the repository for controls and debug access.'
            echo
            echo '## Build report'
            echo '```'
            cat /mnt/omarchy-build/omarchy-thor.img.report.txt
            echo '```'
            echo '## Verification'
            echo '```'
            cat /mnt/omarchy-build/omarchy-thor.VERIFICATION.txt
            echo '```'
          } > notes.md
          gh release create "$tag" \
            --title "omarchy-thor $tag ($(date -u +%F))" \
            --notes-file notes.md \
            /mnt/omarchy-build/omarchy-thor.img.xz* \
            /mnt/omarchy-build/SHA256SUMS \
            /mnt/omarchy-build/omarchy-thor.img.report.txt \
            /mnt/omarchy-build/omarchy-thor.VERIFICATION.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thor-build-report
          path: |
            /mnt/omarchy-build/omarchy-thor.img.report.txt
            /mnt/omarchy-build/omarchy-thor.VERIFICATION.txt
          if-no-files-found: ignore
